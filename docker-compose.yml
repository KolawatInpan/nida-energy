services:
  db:
    image: postgres:16-alpine
    container_name: nida-db
    restart: unless-stopped
    profiles: ["data", "fullnode"]
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energy_trading}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-energy_trading}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: nida-pgadmin
    restart: unless-stopped
    profiles: ["data", "fullnode"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@nida.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_SERVER_MODE:-True}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  prisma:
    image: diaboliccz/nida-database:latest
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: nida-prisma
    restart: unless-stopped
    profiles: ["data", "fullnode"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:***@db:5432/energy_trading?schema=public}
      DATABASE_URL_DEMO: ${DATABASE_URL_DEMO:-postgresql://postgres:***@db:5432/energy_trading_demo?schema=public}
    ports:
      - "5555:5555"

  blockchain:
    image: diaboliccz/nida-blockchain:latest
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: nida-blockchain
    restart: unless-stopped
    profiles: ["node", "fullnode"]
    env_file:
      - .env
    ports:
      - "${BLOCKCHAIN_PORT:-8545}:8545"

  backend:
    image: diaboliccz/nida-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    pull_policy: always
    container_name: nida-backend
    restart: unless-stopped
    profiles: ["node", "fullnode"]
    env_file:
      - .env
    depends_on:
      blockchain:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      RUN_PRISMA_MIGRATE: ${RUN_PRISMA_MIGRATE:-false}
      DEFAULT_DATA_MODE: ${DEFAULT_DATA_MODE:-real}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin123@db:5432/energy_trading?schema=public}
      DATABASE_URL_DEMO: ${DATABASE_URL_DEMO:-postgresql://postgres:admin123@db:5432/energy_trading_demo?schema=public}
      ETH_RPC_URL: ${ETH_RPC_URL:-http://blockchain:8545}
      ETH_PRIVATE_KEY: ${ETH_PRIVATE_KEY:-}
      ETH_CHAIN_ID: ${ETH_CHAIN_ID:-31337}
      ETH_EXPLORER_BASE_URL: ${ETH_EXPLORER_BASE_URL:-}
      ETH_VERIFICATION_CONTRACT_ADDRESS: ${ETH_VERIFICATION_CONTRACT_ADDRESS:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASS: ${GMAIL_PASS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MOCK_ENERGY_CRON: ${MOCK_ENERGY_CRON:-0 * * * *}
      ENERGY_FEED_URL: ${ENERGY_FEED_URL:-http://10.10.161.239:8089}
      ENERGY_FEED_INTERVAL_SEC: ${ENERGY_FEED_INTERVAL_SEC:-60}
      ENERGY_FEED_ENABLED: ${ENERGY_FEED_ENABLED:-true}
      ENERGY_FEED_BUILDING_MAP: ${ENERGY_FEED_BUILDING_MAP:-{\"RAT\":\"ratchaphruek\",\"AUD\":\"auditorium\",\"MAL\":\"malai\"}}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    image: diaboliccz/nida-frontend:latest
    build:
      context: ./frontend-vite
      dockerfile: Dockerfile
    pull_policy: always
    container_name: nida-frontend
    restart: unless-stopped
    profiles: ["proxy"]
    env_file:
      - .env
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000/api}
    ports:
      - "80:80"

volumes:
  postgres_data:
  pgadmin_data:
