services:
  frontend:
    image: nida-frontend-vite:latest
    build:
      context: .
      dockerfile: frontend-vite/Dockerfile
    container_name: nida-frontend
    restart: unless-stopped
    environment:
      # ระบุ IP ของ Backend VM เพื่อให้หน้าเว็บยิง API ไปถูกที่
      REACT_APP_API_BASE: ${REACT_APP_API_BASE:-http://<IP_ของ_BACKEND_VM>:8000/api}
      REACT_APP_APPAPI: ${REACT_APP_APPAPI:-http://<IP_ของ_BACKEND_VM>:8000/api}
      REACT_APP_API: ${REACT_APP_API:-http://<IP_ของ_BACKEND_VM>:8000/api/}
      REACT_APP_APIURL: ${REACT_APP_APIURL:-http://<IP_ของ_BACKEND_VM>:8000/api/users}
      # ถ้ามีการใช้ Mockup Mode
      REACT_APP_MOCKUPMODE: ${REACT_APP_MOCKUPMODE:-false}
      DEFAULT_DATA_MODE: ${DEFAULT_DATA_MODE:-real}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
