services:
  backend:
    image: nida-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nida-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://frontend-vm-ip:3000}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      RUN_PRISMA_MIGRATE: ${RUN_PRISMA_MIGRATE:-false}
      DEFAULT_DATA_MODE: ${DEFAULT_DATA_MODE:-real}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the external PostgreSQL endpoint}
      DATABASE_URL_DEMO: ${DATABASE_URL_DEMO:-}
      ETH_RPC_URL: ${ETH_RPC_URL:-http://blockchain-vm-ip:8545}
      ETH_PRIVATE_KEY: ${ETH_PRIVATE_KEY:-}
      ETH_CHAIN_ID: ${ETH_CHAIN_ID:-31337}
      ETH_EXPLORER_BASE_URL: ${ETH_EXPLORER_BASE_URL:-}
      ETH_VERIFICATION_CONTRACT_ADDRESS: ${ETH_VERIFICATION_CONTRACT_ADDRESS:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  blockchain:
    image: nida-blockchain:latest
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: nida-blockchain
    restart: unless-stopped
    ports:
      - "${BLOCKCHAIN_PORT:-8545}:8545"